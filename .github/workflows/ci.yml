name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # O CI usa o agent determinístico: nenhuma chave de LLM é necessária.
      AGENT_RUNNER: scripted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      AGENT_RUNNER: scripted
      TICKETS_OUTAGE_RATE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Sobe web + serviço de chamados e roda o E2E
        run: |
          pnpm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4001/health >/dev/null && curl -s http://localhost:3000/login >/dev/null && break
            sleep 1
          done
          pnpm e2e || (cat server.log; exit 1)
